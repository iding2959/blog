#---------------------------
# Hexo Fluid 主题自定义配置
#---------------------------

# 网站标题与导航栏
navbar:
  # 导航栏左侧的标题，为空则按 hexo config 中的配置
  blog_title: "iDing's 博客"
  # 导航栏毛玻璃特效，实验性功能，可能会造成卡顿
  ground_glass:
    enable: false
  # 导航菜单：theme.navbar.menu 是主题唯一读取路径，必须是数组；
  # 每项用 link 指定跳转地址（不是 path），带 submenu 的项会渲染成下拉菜单。
  menu:
    - { name: "首页", link: "/", icon: "iconfont icon-home-fill" }
    - { name: "归档", link: "/archives/", icon: "iconfont icon-archive-fill" }
    # 「分类」保持为普通链接：点击直接进入分类总览页，不挂下拉菜单。
    # 如需恢复下拉子菜单，改回下面被注释的形式即可；注意两点：
    # ① 分类名含空格时 Hexo 生成的目录名会把空格转成连字符（AI 应用 → /categories/AI-应用/）；
    # ② 空分类（如当前的「杂谈」）不生成页面，写进子菜单会 404。
    # - name: "分类"
    #   link: "/categories/"
    #   icon: "iconfont icon-category-fill"
    #   submenu:
    #     - { name: "AI 应用", link: "/categories/AI-应用/" }
    #     - { name: "基础设施", link: "/categories/基础设施/" }
    #     - { name: "开发实践", link: "/categories/开发实践/" }
    #     - { name: "网络与代理", link: "/categories/网络与代理/" }
    #     - { name: "工具与效率", link: "/categories/工具与效率/" }
    - { name: "分类", link: "/categories/", icon: "iconfont icon-category-fill" }
    - { name: "标签", link: "/tags/", icon: "iconfont icon-tags-fill" }
    - { name: "关于", link: "/about/", icon: "iconfont icon-user-fill" }
    - { name: "友链", link: "/links/", icon: "iconfont icon-link-fill" }

# 首页
index:
  # 首页副标题的独立设置
  slogan:
    enable: true
    # 为空则按 hexo config.subtitle 显示
    text: "欢迎访问iDing's博客"

# 友情链接页
links:
  # 友链的成员项
  items:
    - title: Hexo官网 # 名称
      link: https://hexo.io # 链接
      avatar: https://hexo.io/logo.svg # 头像
      # descr 显示在页脚，intro 显示在 /links/ 页，两个字段名都写才能都显示
      descr: 快速、简洁且高效的博客框架
      intro: 快速、简洁且高效的博客框架
    - title: Fluid主题
      link: https://github.com/fluid-dev/hexo-theme-fluid
      avatar: /img/fluid.png
      descr: 一款美观、优雅的Hexo主题
      intro: 一款美观、优雅的Hexo主题
  # 当成员头像加载失败时，替换为指定图片
  onerror_avatar: /img/avatar.png # 可选
  # 友链下方自定义区域，支持 HTML
  custom:
    enable: true
    content: '<hr><div>在这里，我推荐了一些我喜欢的博客和网站。</div>'

# 文章页
post:
  # 文章标题下方的元信息
  meta:
    # 作者，优先根据 front-matter 里 author 字段，其次是 hexo 配置中 author 值
    author:
      enable: true
    # 文章日期，优先根据 front-matter 里 date 字段，其次是 md 文件日期
    date:
      enable: true
      # 格式参照 ISO-8601 日期格式化
      format: "LL a"
    # 字数统计
    wordcount:
      enable: true
    # 阅读时长
    min2read:
      enable: true
      # 每分钟阅读字数：主题读取的键名是 wpm，写成 words 会被忽略
      wpm: 100
    # 浏览量
    views:
      enable: false

  # 文章目录：主题读取路径是 post.toc，写在顶层 toc 下不会生效
  toc:
    enable: true
    # Fluid 1.9.9 起官方支持 expand_all（模板会据此把 collapseDepth 置为 6）；
    # 1.9.8 时代没有该键，故此前手工写的 collapseDepth，现已回归官方写法
    expand_all: true

# 关于页
# 写在用户配置里而非主题 _config.yml，主题升级时才不会丢失
about:
  name: "iDing"
  intro: " "
  # 注意：icons 是数组，主题配置合并对数组是整体替换，
  # 所以这里必须写全，否则主题默认的三个图标会一并丢失
  icons:
    - { class: "iconfont icon-github-fill", link: "https://github.com/idinging", tip: "GitHub" }
    - { class: "iconfont icon-douban-fill", link: "https://douban.com", tip: "豆瓣" }
    - { class: "iconfont icon-wechat-fill", qrcode: "/img/favicon.png" }

# 分类页
category:
  # 分类排序字段：sort_order 由 scripts/category_order.js 在生成前注入每个 Category 模型
  # 写在这里而非主题 _config.yml，主题升级时才不会丢失（主题原值为 -length）
  order_by: "sort_order"

# 页脚
footer:
  # 页脚第一行文字，这里作为 RSS 订阅入口
  content: '<a href="/atom.xml" target="_blank" rel="noopener" title="订阅本站 RSS"><i class="iconfont icon-rss"></i> RSS 订阅</a>'
  # 展示网站的 PV、UV 统计数
  statistics:
    enable: false

# 深色模式
dark_mode:
  # 开启后会在导航栏显示切换按钮
  enable: true
  # 默认的选项（followSystem: 跟随系统，light: 浅色，dark: 深色）
  default: auto

# 全局字体配置
font:
  # 文章内容的字体
  font_size: 16px
  # 代码的字体
  code_font_size: 85%

# 打赏
# Fluid 1.9.8 已移除打赏功能，主题没有 reward 配置段，以下配置不会生效；
# 保留仅为记录，将来主题恢复该功能时可直接复用。
reward:
  enable: false
  # 打赏图标
  icon: fas fa-donate
  # 打赏标题
  title: 感谢您的支持
  # 打赏方式
  methods:
    # 支付宝
    # alipay:
    #   icon: fab fa-alipay
    #   text: 支付宝
    #   link: https://example.com
    # 微信
    # wechat:
    #   icon: fab fa-weixin
    #   text: 微信
    #   link: https://example.com

# 代码高亮
code:
  copy_btn: true
  language:
    enable: true
  highlight:
    enable: true
    lib: "highlightjs"

# 图片懒加载
lazyload:
  enable: true

# 搜索功能
search:
  enable: true
  # 文章内容搜索
  content: true

# 指定自定义 css 文件路径
custom_css:
  - /css/custom.css

# 网页访问统计
web_analytics:
  enable: false
